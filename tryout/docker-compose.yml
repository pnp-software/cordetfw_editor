services:

  db:
    # Pinned, tested version (Django 5.2 supports MySQL >= 8.0.11). The data directory is
    # specific to this major version: never point a different major version at it.
    image: mysql:8.4
    restart: always
    volumes:
      - ./mysql84_db_persist:/var/lib/mysql
      - ./mysql_init:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: rootPassword
      MYSQL_DATABASE: cordetfw
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpw
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootPassword", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - 7001:80
    environment:
      PMA_HOST: db
    depends_on:
      db:
        condition: service_healthy

  cordet_editor:
    build:
      context: ../
      dockerfile: tryout/Dockerfile
    restart: always
    volumes:
      - ../:/usr/src/app
    ports:
      - 7000:7000
    depends_on:
      db:
        condition: service_healthy
