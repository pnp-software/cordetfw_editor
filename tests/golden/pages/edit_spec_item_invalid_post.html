<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="/static/bootstrap-suggest.min.js"></script>
<script>
var linkElements = [
  
    {path: 'DataItem:Alpha:colour', comment: 'Current colour'},
  
    {path: 'DataItem:Alpha:count', comment: 'Counter'},
  
    {path: 'DataItem:Beta:level', comment: 'Level v2'},
  
    {path: 'DataItemType:Types:Int32', comment: '32-bit integer'},
  
    {path: 'EnumType:Enums:Colour', comment: 'Colour type'},
  
    {path: 'EnumValue:Enums:Green', comment: 'Green'},
  
    {path: 'EnumValue:Enums:Red', comment: 'Red'},
  
    {path: 'InfoItem:Info:note', comment: 'A note'},
  
];
$('.link-suggest').suggest('#', {
  data: linkElements,
  map: function(element) {
    return {
      value: element.path,
      text: '<strong>'+element.path+'</strong>'+'&Tab;<small>'+element.comment+'</small>'
    }
  },
  filter: {
    casesensitive: false,
    limit: 16
  }
})
</script>
