<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">

        <link href="/static/bootstrap-suggest.css" rel="stylesheet">
    </head>
    <body class="d-flex flex-column min-vh-100">

        <header class="container-fluid px-md-4">
            <nav class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-3 border-bottom">
                <ul class="nav nav-pills">
                    <li class="nav-item">
                        
                        <a class="nav-link  active " href="/editor/">Home</a>
                    </li>
                    <li class="nav-item">
                        
                        <a class="nav-link " href="/pnpAdmin/">Admin</a>
                    </li>
                    
                    <li class="nav-item">
                        
                        <a class="nav-link " href="/editor/help/">Help</a>
                    </li>
                </ul>
                
            </nav>
        </header>

        <main class="flex-grow-1">
            

            







<div class="container col-xl-10 col-xxl-8 px-4 py-5">
    <div class="row align-items-center g-lg-5 py-5">
        <div class="col-lg-7 text-center text-lg-start">
            <h1 class="display-4 fw-bold lh-1 mb-3 text-center">Cordet FW Editor</h1>
            <p class="fs-4 text-center">Web-based editor to support the definition of interlinked specification items</p>
        </div>
        <div class="col-md-10 mx-auto col-lg-5">
            <form class="p-4 p-md-5 border rounded-3 bg-light"
                  action="/editor/login/" method="POST">
                <input type="hidden" name="csrfmiddlewaretoken" value="CSRF">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control"
                           id="username" placeholder="Username" name="username" autofocus>
                    <label for="username">Username</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control"
                           id="password" placeholder="Password" name="password">
                    <label for="password">Password</label>
                </div>
                <button class="w-100 btn btn-lg btn-primary" type="submit">Sign-In</button>
                <hr class="my-4">
                <small class="d-flex justify-content-between text-muted">
                    <a class="bi-caret-right-fill text-decoration-none"
                       href="/editor/password_reset/">
                        lost password?
                    </a>
                    <a class="bi-caret-right-fill text-decoration-none"
                       href="mailto:pnp-software@pnp-software.com">
                        request access
                    </a>
                </small>
            </form>
        </div>
    </div>



        </main>

        <div class="container-fluid px-md-4">
            <footer class="py-3 my-4 border-top">
                <p class="text-center text-muted">© 2022 
                    <a class="link-primary text-decoration-none"
                       href="https://www.pnp-software.com"
                       target="_blank" >P&P Software GmbH</a>. All Rights Reserved.
                </p>
            </footer>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>

    </body>
</html>
