<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">

        <link href="/static/bootstrap-suggest.css" rel="stylesheet">
    </head>
    <body class="d-flex flex-column min-vh-100">

        <header class="container-fluid px-md-4">
            <nav class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-3 border-bottom">
                <ul class="nav nav-pills">
                    <li class="nav-item">
                        
                        <a class="nav-link " href="/editor/">Home</a>
                    </li>
                    <li class="nav-item">
                        
                        <a class="nav-link " href="/pnpAdmin/">Admin</a>
                    </li>
                    
                    <li class="nav-item">
                        
                        <a class="nav-link " href="/editor/help/">Help</a>
                    </li>
                </ul>
                
            </nav>
        </header>

        <main class="flex-grow-1">
            

            
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-10 col-xl-9">
            <h2 class="my-3">Login</h2>
            

            

            <form method="post" action="/editor/login/">
                <input type="hidden" name="csrfmiddlewaretoken" value="CSRF">
                <div class="mb-3 row">
                    <label for="id_username"
                           class="col-form-label col-2">
                        Username*
                    </label>
                    <div class="col-10 col-lg-8">
                        <input type="text" id="id_username"
                               class="form-control "
                               name="username" value="None"
                               required
                               >
                        
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="id_password"
                           class="col-form-label col-2">
                        Password*
                    </label>
                    <div class="col-10 col-lg-8">
                        <input type="password" id="id_password"
                                  class="form-control 
                                        link-suggest"
                                  name="password" value="None"
                                  required
                                  >
                        
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" value="login">Login</button>
                <input type="hidden" name="next" value="" />
            </form>
        </div>
    </div>
</div>

        </main>

        <div class="container-fluid px-md-4">
            <footer class="py-3 my-4 border-top">
                <p class="text-center text-muted">© 2022 
                    <a class="link-primary text-decoration-none"
                       href="https://www.pnp-software.com"
                       target="_blank" >P&P Software GmbH</a>. All Rights Reserved.
                </p>
            </footer>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>

    </body>
</html>
